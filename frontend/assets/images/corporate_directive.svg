<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_corp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05170A"/>
      <stop offset="100%" stop-color="#11421C"/>
    </linearGradient>
    <filter id="shadow_corp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg_corp)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="24" width="720" height="48" rx="8" fill="#1B4D25" stroke="rgba(92,184,96,0.3)"/>
  <text x="60" y="54" fill="#9FD4A2" font-family="sans-serif" font-weight="bold" font-size="16">🏢 CORPORATE DIRECTIVE AUDIT ENGINE</text>
  <rect x="580" y="36" width="160" height="24" rx="12" fill="#E6F4E8" stroke="#5CB860"/>
  <text x="660" y="52" fill="#11421C" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✓ AUTHENTICATED</text>
  
  <!-- Document Frame -->
  <g filter="url(#shadow_corp)" transform="translate(160, 90)">
    <rect width="480" height="320" rx="14" fill="#FFFDF9" stroke="#9FD4A2" stroke-width="2"/>
    <!-- Top Header -->
    <path d="M0 14 Q0 0 14 0 L466 0 Q480 0 480 14 L480 50 L0 50 Z" fill="#F0F9F1"/>
    <text x="24" y="32" fill="#061E0E" font-family="sans-serif" font-weight="bold" font-size="16">INTERNAL CORPORATE DIRECTIVE v3.2</text>
    <text x="390" y="32" fill="#2A7334" font-family="sans-serif" font-weight="bold" font-size="12">CONFIDENTIAL</text>
    
    <!-- WhatsApp Screenshot Match Stream -->
    <rect x="24" y="70" width="432" height="64" rx="8" fill="#E6F4E8" stroke="#5CB860"/>
    <text x="40" y="94" fill="#11421C" font-family="sans-serif" font-weight="bold" font-size="14">WhatsApp Screenshot vs Official Original</text>
    <text x="40" y="116" fill="#2A7334" font-family="sans-serif" font-weight="bold" font-size="14">✓ Integrity Match: 100% (No Digital Alterations)</text>
    
    <!-- Audit Lines -->
    <rect x="24" y="150" width="432" height="38" rx="6" fill="#FFFDF9" stroke="rgba(17,66,28,0.15)"/>
    <text x="40" y="174" fill="#11421C" font-family="sans-serif" font-size="13">Executive Signature: Digitally Verified (SHA-256 Valid)</text>
    
    <rect x="24" y="200" width="432" height="38" rx="6" fill="#FFFDF9" stroke="rgba(17,66,28,0.15)"/>
    <text x="40" y="224" fill="#11421C" font-family="sans-serif" font-size="13">Distribution Source: Authorized HR Intranet Portal</text>
    
    <!-- Audit Badge -->
    <rect x="24" y="255" width="200" height="34" rx="17" fill="#11421C"/>
    <text x="124" y="277" fill="#9FD4A2" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✓ TAMPERING: 0%</text>
  </g>
</svg>
